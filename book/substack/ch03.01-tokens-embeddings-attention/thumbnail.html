<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Attention Cannot Choose Your Sources</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
    --plum: #6f2d5f; --cyan: #00cfff; --teal: #00c89a; --sky: #26abe7;
    --pedro-orange: #f18d2b; --outline: #000000; --on-plum: #ffffff; --ink: #1b0b17;
    --font-display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --stroke-outline: 6px; /* 3px token, doubled at 1456px canvas scale */
    --radius-md: 28px;
  }
* { box-sizing: border-box; }
body { margin:0; width:1456px; height:816px; overflow:hidden; background:var(--plum); color:var(--on-plum); }
.eyebrow { position:absolute; left:72px; top:70px; font:700 26px/1.3 var(--font-mono); }
.tokens { position:absolute; left:80px; top:304px; display:flex; gap:24px; }
.chip { width:232px; height:88px; display:flex; align-items:center; justify-content:center; border:6px solid black; border-radius:18px; box-shadow:16px 16px 0 black; color:var(--ink); background:var(--sky); font:700 28px/1 var(--font-mono); }
.chip:nth-child(2) { background:var(--cyan); }
.chip:nth-child(3) { background:var(--teal); }
.chip:nth-child(4) { background:var(--pedro-orange); }
.chip:nth-child(5) { background:white; }
.arcs { position:absolute; left:80px; top:154px; width:1256px; height:160px; overflow:visible; }
h1 { position:absolute; left:72px; top:452px; margin:0; width:1060px; font:700 78px/1.08 var(--font-display); }
.signature { position:absolute; left:72px; bottom:64px; display:flex; gap:20px; align-items:center; font:600 25px/1 var(--font-mono); }
.signature img { width:72px; height:72px; object-fit:contain; }
.pedro { position:absolute; right:64px; bottom:64px; width:226px; height:226px; object-fit:contain; }
</style></head><body>
<div class="eyebrow">Context Engineering · 09</div>
<svg class="arcs" viewBox="0 0 1256 160" aria-label="Attention links between selected token positions" role="img">
 <path d="M116 150 C116 -20 628 -20 628 150" fill="none" stroke="black" stroke-width="18"/>
 <path d="M116 150 C116 -20 628 -20 628 150" fill="none" stroke="#00cfff" stroke-width="6"/>
 <path d="M628 150 C628 5 1140 5 1140 150" fill="none" stroke="black" stroke-width="18"/>
 <path d="M628 150 C628 5 1140 5 1140 150" fill="none" stroke="#00c89a" stroke-width="6"/>
 <path d="M372 150 C372 62 884 62 884 150" fill="none" stroke="black" stroke-width="18"/>
 <path d="M372 150 C372 62 884 62 884 150" fill="none" stroke="#f18d2b" stroke-width="6"/>
</svg>
<div class="tokens" aria-label="Illustrative token chips, not a tokenizer output"><div class="chip">drain</div><div class="chip">traffic</div><div class="chip">before</div><div class="chip">restart</div><div class="chip">worker</div></div>
<h1>Attention Cannot<br>Choose Your Sources</h1>
<div class="signature"><img src="../brand/spt-logo-standard-bluepurple.png" alt="SoyPeteTech logo">@soypetetech</div>
<img class="pedro" src="../brand/pedrobot-professor.png" alt="PedroBot professor">
</body></html>
