<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1456, initial-scale=1">
<title>Stop Saying “The AI Failed” — SoyPeteTech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --plum: #6f2d5f; --cyan: #00cfff; --teal: #00c89a; --sky: #26abe7;
    --pedro-orange: #f18d2b; --outline: #000000; --on-plum: #ffffff; --ink: #1b0b17;
    --font-display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --stroke-outline: 6px; /* 3px token, doubled at 1456px canvas scale */
    --radius-md: 28px;
  }
  * { box-sizing: border-box; }
  body { margin:0; width:1456px; height:816px; overflow:hidden; background:var(--teal); color:var(--ink); }
  .canvas { position:relative; width:1456px; height:816px; }
  .eyebrow { position:absolute; left:72px; top:68px; margin:0; font:700 26px/1.3 var(--font-mono); }
  .title { position:absolute; left:736px; top:210px; width:648px; margin:0; font:700 96px/1.06 var(--font-display); letter-spacing:-2px; }
  .title span { display:block; }
  .prop { position:absolute; display:flex; justify-content:center; align-items:center; border:6px solid #000; box-shadow:16px 16px 0 #000; font:700 34px/1 var(--font-mono); }
  .model { left:400px; top:174px; width:240px; height:116px; background:var(--pedro-orange); transform:rotate(3deg); }
  .pipeline { left:372px; top:584px; width:288px; height:108px; background:var(--plum); color:var(--on-plum); }
  .pedro { position:absolute; left:72px; top:482px; width:270px; height:270px; object-fit:contain; }
  .arrow { position:absolute; left:0; top:0; width:700px; height:590px; }
  .foot { position:absolute; left:744px; top:650px; display:flex; align-items:center; gap:20px; font:700 28px/1 var(--font-mono); }
  .foot img { width:88px; height:88px; object-fit:contain; }
</style>
</head>
<body>
<main class="canvas">
  <p class="eyebrow">Context Engineering · 06</p>
  <svg class="arrow" viewBox="0 0 700 590" aria-label="A blame arrow points at the model, then bends back toward the pipeline" role="img">
    <defs><path id="blame" d="M 100 190 H 302 V 158 L 380 230 L 302 302 V 270 H 180 V 350 Q 180 390 220 390 H 510 Q 570 390 570 450 V 480 H 610 L 530 560 L 450 480 H 490 V 470 H 220 Q 100 470 100 350 Z"/></defs>
    <use href="#blame" transform="translate(16 16)" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    <use href="#blame" fill="#00cfff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  </svg>
  <div class="prop model">MODEL</div>
  <div class="prop pipeline">PIPELINE</div>
  <img class="pedro" src="../brand/pedrobot-mean.png" alt="PedroBot looks unimpressed">
  <h1 class="title"><span>Stop Saying</span><span>“The AI</span><span>Failed”</span></h1>
  <div class="foot"><img src="../brand/spt-logo-standard-bluepurple.png" alt="SoyPeteTech logo"><span>@soypetetech</span></div>
</main>
</body>
</html>
