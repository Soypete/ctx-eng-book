<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Resolve the Meaning Before You Grant the Action</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --plum: #6f2d5f; --cyan: #00cfff; --teal: #00c89a; --sky: #26abe7;
    --pedro-orange: #f18d2b; --outline: #000000; --on-plum: #ffffff; --ink: #1b0b17;
    --font-display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --stroke-outline: 6px; /* 3px token, doubled at 1456px canvas scale */
    --radius-md: 28px;
  }
* { box-sizing:border-box; }
body { margin:0; width:1456px; height:816px; overflow:hidden; background:var(--cyan); color:var(--ink); }
.canvas { position:relative; width:1456px; height:816px; }
.eyebrow { position:absolute; left:72px; top:76px; font:700 26px/1.2 var(--font-mono); }
.brand { position:absolute; right:72px; top:64px; display:flex; align-items:center; gap:16px; font:700 24px/1 var(--font-mono); }
.brand img { width:64px; height:64px; object-fit:contain; }
.bubble { position:absolute; top:188px; width:420px; height:250px; padding:30px; border:6px solid black; border-radius:28px; box-shadow:16px 16px 0 black; }
.bubble::after { content:""; position:absolute; bottom:-26px; width:36px; height:36px; border-right:6px solid black; border-bottom:6px solid black; transform:rotate(45deg); background:inherit; }
.said { left:72px; background:white; }
.meant { right:72px; background:var(--teal); }
.said::after { right:40px; }
.meant::after { left:40px; }
.label { font:700 22px/1.3 var(--font-mono); margin-bottom:22px; }
.quote { font:600 36px/1.15 var(--font-display); }
.robot { position:absolute; left:530px; top:212px; width:360px; height:320px; object-fit:contain; }
h1 { position:absolute; left:72px; top:554px; width:1312px; margin:0; font:700 78px/1.08 var(--font-display); letter-spacing:-1px; }
</style></head><body><main class="canvas">
<div class="eyebrow">Context Engineering · 13</div>
<div class="brand"><img src="../brand/spt-logo-standard-bluepurple.png" alt="SoyPeteTech logo">@soypetetech</div>
<div class="bubble said"><div class="label">what you said</div><div class="quote">“Analyze<br>the data.”</div></div>
<div class="bubble meant"><div class="label">what you meant</div><div class="quote">“Sales.<br>Last calendar<br>month.”</div></div>
<img class="robot" src="../brand/pedrobot-confused.png" alt="Confused PedroBot between two speech bubbles">
<h1>Resolve the Meaning<br>Before You Grant the Action</h1>
</main></body></html>
