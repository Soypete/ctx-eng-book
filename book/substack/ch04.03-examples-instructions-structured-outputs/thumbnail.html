<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Valid JSON Is Still Only a Proposal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --plum: #6f2d5f; --cyan: #00cfff; --teal: #00c89a; --sky: #26abe7;
    --pedro-orange: #f18d2b; --outline: #000000; --on-plum: #ffffff; --ink: #1b0b17;
    --font-display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --stroke-outline: 6px; /* 3px token, doubled at 1456px canvas scale */
    --radius-md: 28px;
  }
* { box-sizing: border-box; }
body { margin:0; width:1456px; height:816px; overflow:hidden; background:var(--plum); }
.split { position:absolute; inset:0; background:var(--teal); clip-path:polygon(71% 0,100% 0,100% 100%,50% 100%); }
.diagonal { position:absolute; inset:0; background:#000; clip-path:polygon(70.6% 0,71.1% 0,50.1% 100%,49.6% 100%); }
.eyebrow { position:absolute; left:80px; top:82px; color:var(--cyan); font:700 25px/1.3 var(--font-mono); }
h1 { position:absolute; left:80px; top:195px; margin:0; color:white; font:700 78px/1.08 var(--font-display); text-shadow:5px 5px 0 #000; }
.schema { position:absolute; left:865px; top:86px; width:495px; padding:28px; background:white; border:6px solid black; border-radius:28px; box-shadow:16px 16px 0 black; color:var(--ink); }
.schema header { font:700 25px/1.4 var(--font-mono); border-bottom:6px solid black; padding-bottom:16px; margin-bottom:20px; }
.schema pre { margin:0; font:600 23px/1.8 var(--font-mono); }
.schema .type { color:var(--plum); }
.check { position:absolute; right:24px; top:20px; width:52px; height:52px; background:var(--teal); border:6px solid #000; box-shadow:16px 16px 0 black; font:700 35px/40px var(--font-body); text-align:center; }
.pedro { position:absolute; left:1010px; top:445px; width:320px; height:290px; object-fit:contain; }
.foot { position:absolute; left:80px; bottom:72px; display:flex; align-items:center; gap:20px; color:white; font:600 26px/1 var(--font-mono); }
.foot img { width:80px; height:80px; object-fit:contain; }
</style></head><body>
<div class="split"></div><div class="diagonal"></div>
<div class="eyebrow">Context Engineering · 14</div>
<h1>Valid JSON<br>Is Still Only<br>a Proposal</h1>
<section class="schema" aria-label="JSON schema card">
<header>SCHEMA v1</header><div class="check">✓</div>
<pre>{
  dataset: <span class="type">string</span>
  start:   <span class="type">string</span>
  end:     <span class="type">string</span>
}</pre>
</section>
<img class="pedro" src="../brand/pedrobot-happy.png" alt="Happy PedroBot">
<div class="foot"><img src="../brand/spt-logo-standard-bluepurple.png" alt="SoyPeteTech logo">@soypetetech</div>
</body></html>
