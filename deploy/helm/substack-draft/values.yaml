# Cron schedule; the job drafts the post SCHEDULE.md dates for the day it runs.
schedule: "0 7 * * 1,3,5"
timeZone: America/Denver
suspend: false

# Repo tarball the job downloads and runs scripts/substack_draft.py from.
repoTarball: https://codeload.github.com/Soypete/ctx-eng-book/tar.gz/refs/heads/main
# Top-level directory inside that tarball (<repo>-<ref>).
repoDir: ctx-eng-book-main

image:
  repository: python
  tag: 3.12-slim
  pullPolicy: IfNotPresent

# Existing Secret holding DISCORD_SECRET and DISCORD_USER_ID (and, when openbao.enabled is
# false, SUBSTACK_SESSION_COOKIE). The chart never creates it, so no secret lands in git.
existingSecret: ctx-eng-book-secrets

# Pull the Substack session cookie (substack.sid) from OpenBao on refurb through the
# cluster's agent injector, so refreshing it in OpenBao is the only step. The value at
# <path> key <key> is exported as SUBSTACK_SESSION_COOKIE before the script runs and
# overrides any copy in existingSecret.
openbao:
  enabled: true
  role: ctx-eng-book-substack-draft   # kubernetes auth role bound to serviceAccount.name
  authPath: auth/kubernetes
  path: secret/apps/substack
  key: token

serviceAccount:
  name: substack-draft

startingDeadlineSeconds: 3600
activeDeadlineSeconds: 900
ttlSecondsAfterFinished: 604800
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
