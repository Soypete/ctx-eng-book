apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: ctx-eng-book
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
          {{- if .Values.openbao.enabled }}
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: {{ .Values.openbao.role | quote }}
            vault.hashicorp.com/agent-inject-secret-substack: {{ .Values.openbao.path | quote }}
            vault.hashicorp.com/agent-inject-template-substack: |
              {{`{{- with secret "`}}{{ .Values.openbao.path }}{{`" -}}`}}
              export SUBSTACK_SESSION_COOKIE='{{`{{ with .Data.data }}{{ .`}}{{ .Values.openbao.key }}{{` }}{{ else }}{{ .Data.`}}{{ .Values.openbao.key }}{{` }}{{ end }}`}}'
              {{`{{- end }}`}}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccount.name }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              workingDir: /work
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  {{- if .Values.openbao.enabled }}
                  . /vault/secrets/substack
                  {{- end }}
                  python3 -c 'import io, os, tarfile, urllib.request
                  data = urllib.request.urlopen(os.environ["REPO_TARBALL"], timeout=60).read()
                  tarfile.open(fileobj=io.BytesIO(data)).extractall("/work", filter="data")'
                  cd /work/{{ .Values.repoDir }}
                  exec python3 scripts/substack_draft.py --scheduled
              env:
                - name: REPO_TARBALL
                  value: {{ .Values.repoTarball | quote }}
              envFrom:
                - secretRef:
                    name: {{ .Values.existingSecret }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
